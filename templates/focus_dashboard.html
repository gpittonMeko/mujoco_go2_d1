<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go2 Focus</title>
  <link rel="stylesheet" href="{{ script_root }}/static/focus/focus_dashboard.css?v={{ asset_ver }}" />
</head>
<body>
  <div class="focus-app">
    <header class="focus-top">
      <div>
        <h1>Go2 Focus</h1>
        <p>{{ go2_host }}:{{ dashboard_port }} - Presa / Teach - Motori - Hermes</p>
      </div>
      <div class="focus-status">
        <span id="focusHealthPill" class="pill warn">check...</span>
        <span id="focusTeachPill" class="pill">Teach</span>
      </div>
    </header>

    <nav class="focus-tabs" aria-label="Sezioni">
      <button class="active" data-tab="teach" type="button">Presa / Teach</button>
      <button data-tab="motors" type="button">Motori</button>
      <button data-tab="hermes" type="button">Hermes</button>
    </nav>

    <main>
      <section class="panel active" id="tab-teach">
        <iframe id="teachFrame" title="Presa / Teach" src="{{ script_root }}/focus/teach"></iframe>
      </section>

      <section class="panel" id="tab-hermes">
        <iframe id="hermesFrame" title="Hermes" data-src="{{ script_root }}/focus/hermes"></iframe>
      </section>

      <section class="panel" id="tab-motors">
        <iframe id="motorsFrame" title="Stato motori Go2" data-src="{{ script_root }}/focus/motor"></iframe>
      </section>

    </main>
  </div>
  <script>
    window.__FOCUS_SCRIPT_ROOT__ = "{{ script_root }}";
  </script>
  <script src="{{ script_root }}/static/focus/focus_dashboard.js?v={{ asset_ver }}" defer></script>
</body>
</html>
