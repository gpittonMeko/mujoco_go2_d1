<div class="calib-minimal">
  <style>
    .calib-minimal {
      --cb: rgba(148, 163, 184, 0.22);
      --ok: #34d399;
      --err: #f87171;
      --idle: #64748b;
    }
    .calib-minimal-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .calib-minimal-toolbar .calib-btn-ghost {
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid var(--cb);
      background: rgba(15, 23, 42, 0.6);
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .calib-minimal-toolbar .calib-btn-ghost:hover {
      border-color: rgba(34, 211, 238, 0.35);
      background: rgba(34, 211, 238, 0.08);
    }
    .calib-minimal-preview-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--cb);
      background: #020617;
      aspect-ratio: 16 / 10;
      max-height: min(48vh, 480px);
      margin: 0 auto 14px;
    }
    .calib-minimal-preview-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      vertical-align: middle;
    }
    .calib-minimal-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .calib-minimal-badge[data-seen="1"] {
      background: rgba(52, 211, 153, 0.22);
      color: var(--ok);
      border: 1px solid rgba(52, 211, 153, 0.45);
    }
    .calib-minimal-badge[data-seen="0"] {
      background: rgba(248, 113, 113, 0.15);
      color: #fecaca;
      border: 1px solid rgba(248, 113, 113, 0.35);
    }
    .calib-progress-track {
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      margin-bottom: 6px;
    }
    .calib-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg, #22d3ee, #34d399);
      transition: width 0.2s ease;
    }
    .calib-phase {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
      min-height: 1.25em;
    }
    .calib-result {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--cb);
      background: rgba(15, 23, 42, 0.35);
    }
    .calib-result[data-state="ok"] {
      border-color: rgba(52, 211, 153, 0.35);
      background: rgba(52, 211, 153, 0.06);
    }
    .calib-result[data-state="err"] {
      border-color: rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.06);
    }
    .calib-result-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .calib-result[data-state="idle"] .calib-result-dot {
      background: var(--idle);
    }
    .calib-result[data-state="ok"] .calib-result-dot {
      background: var(--ok);
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.45);
    }
    .calib-result[data-state="err"] .calib-result-dot {
      background: var(--err);
    }
    .calib-result-title {
      font-weight: 600;
      font-size: 14px;
      color: #f1f5f9;
    }
    .calib-result-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.35;
    }
    .calib-adv {
      margin-top: 14px;
    }
    .calib-adv summary {
      cursor: pointer;
      font-size: 12px;
      color: #64748b;
      user-select: none;
    }
    .calib-adv .calib-adv-body {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .calib-adv input,
    .calib-adv select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
    }
  </style>

  <div class="calib-minimal-toolbar">
    <button type="button" class="primary-go" id="calibBtnSave" onclick="tag5CalibSave()">Calibra</button>
    <button type="button" class="calib-btn-ghost" id="calibBtnRefresh" onclick="tag5CalibRefresh()">Stato</button>
  </div>

  <div class="calib-minimal-preview-wrap">
    <span id="calibDetectionBadge" class="calib-minimal-badge" data-seen="0">TAG 5</span>
    <img id="calibPreviewImg" alt="" decoding="async" />
  </div>

  <div class="calib-progress-track"><div id="calibProgressFill" class="calib-progress-fill"></div></div>
  <div id="calibPhaseLine" class="calib-phase"></div>

  <div id="calibResultBlock" class="calib-result" data-state="idle">
    <span class="calib-result-dot" aria-hidden="true"></span>
    <div>
      <div id="calibResultTitle" class="calib-result-title">Pronto</div>
      <div id="calibResultSub" class="calib-result-sub"></div>
    </div>
  </div>

  <details class="calib-adv">
    <summary>Impostazioni</summary>
    <div class="calib-adv-body">
      <label class="small" style="color: #94a3b8"
        >X (m) <input type="number" step="0.001" id="tag5_nom_x" placeholder="0.19"
      /></label>
      <label class="small" style="color: #94a3b8"
        >Y <input type="number" step="0.001" id="tag5_nom_y" placeholder="0"
      /></label>
      <label class="small" style="color: #94a3b8"
        >Z <input type="number" step="0.001" id="tag5_nom_z" placeholder="0.08"
      /></label>
      <label class="small" style="color: #94a3b8"
        >Camera
        <select id="tag5_calib_camera">
          <option value="0" selected>0 · polso</option>
          <option value="6">6 · RealSense</option>
        </select>
      </label>
      <button type="button" class="calib-btn-ghost" onclick="tag5CalibClear()">Cancella file calibrazione</button>
      <button type="button" class="calib-btn-ghost" onclick="calibGoArm3d()">3D / giunti</button>
    </div>
  </details>
</div>
