<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D1 Focus 5056</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2d;
      --panel2: #1a2740;
      --line: #2d3b5a;
      --text: #e7eefb;
      --muted: #9bb0d4;
      --ok: #40d289;
      --bad: #ff7f7f;
      --accent: #4ea6ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Segoe UI, Tahoma, sans-serif; }
    .top { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; justify-content: space-between; align-items: center; }
    .top h1 { margin: 0; font-size: 18px; }
    .sub { color: var(--muted); font-size: 12px; }
    .tabs { display: flex; gap: 8px; }
    .tabbtn { border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .tabbtn.active { border-color: var(--accent); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .card h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .stream { width: 100%; height: 280px; object-fit: contain; background: #000; border-radius: 8px; border: 1px solid var(--line); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button { border: 1px solid var(--line); background: #23416d; color: #fff; padding: 10px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button.warn { background: #8a4a12; }
    button.danger { background: #8a1f1f; }
    button.neutral { background: #2f3f5d; }
    .status { margin-top: 10px; min-height: 20px; color: var(--muted); font-size: 13px; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .sl { margin-top: 8px; padding: 8px; background: var(--panel2); border-radius: 8px; }
    .sl label { display: grid; grid-template-columns: 140px 1fr 56px; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; }
    .sl input[type=range] { width: 100%; }
    .hide { display: none; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1>D1 Focus Control</h1>
      <div class="sub">{{ d1_arm_host }} :{{ dashboard_port }} - Polso IntelSense + Front Camera</div>
    </div>
    <div class="tabs">
      <button class="tabbtn active" id="tabTeachBtn">Teach</button>
      <button class="tabbtn" id="tabMoveBtn">Movimento</button>
    </div>
  </div>

  <div class="wrap">
    <section id="tabTeach">
      <div class="grid2">
        <div class="card">
          <h3>Camera Polso (IntelSense)</h3>
          <img id="wristStream" class="stream" src="/api/orbbec/live.mjpg" alt="Wrist stream" />
        </div>
        <div class="card">
          <h3>Camera Frontale</h3>
          <img id="frontStream" class="stream" src="/api/front/live.mjpg" alt="Front stream" />
        </div>
      </div>

      <div class="card" style="margin-top:12px;">
        <h3>Motori Braccio (stile legacy)</h3>
        <div class="row">
          <button id="btnCouple">Coppia ON</button>
          <button id="btnEnable" class="neutral">Enable motori</button>
          <button id="btnPower" class="neutral">Power ON</button>
          <button id="btnHold" class="neutral">Hold posa</button>
          <button id="btnRelease" class="danger">Release</button>
          <button id="btnZero" class="warn">Zero</button>
        </div>
      </div>

      <div class="card" style="margin-top:12px;">
        <h3>Scansione 90 e Detection</h3>
        <div class="row">
          <button id="btnRightScan">Vai a destra 90 e scannerizza</button>
          <button id="btnLeftScan">Vai a sinistra 90 e scannerizza</button>
          <button id="btnDetectNow" class="neutral">Solo detection</button>
          <button id="btnTestGrasp" class="warn">Prova presa</button>
        </div>
      </div>

      <div class="card" style="margin-top:12px;">
        <h3>Taratura con Slider (no numeretti a frecce)</h3>
        <div class="sl">
          <label>Yaw scan DX (J0)
            <input id="scanRight" type="range" min="-120" max="120" step="1" value="-87" />
            <span id="scanRightVal">-87</span>
          </label>
          <label>Yaw scan SX (J0)
            <input id="scanLeft" type="range" min="-120" max="120" step="1" value="87" />
            <span id="scanLeftVal">87</span>
          </label>
          <label>Offset J0 presa
            <input id="offJ0" type="range" min="-25" max="25" step="0.5" value="0" />
            <span id="offJ0Val">0.0</span>
          </label>
          <label>Offset J1 presa
            <input id="offJ1" type="range" min="-25" max="25" step="0.5" value="0" />
            <span id="offJ1Val">0.0</span>
          </label>
          <label>Offset J2 presa
            <input id="offJ2" type="range" min="-25" max="25" step="0.5" value="0" />
            <span id="offJ2Val">0.0</span>
          </label>
          <label>Orient J5 extra
            <input id="offJ5" type="range" min="-45" max="45" step="1" value="0" />
            <span id="offJ5Val">0</span>
          </label>
        </div>
        <div class="row">
          <button id="btnApplyOffsets" class="neutral">Salva offset presa</button>
        </div>
      </div>
    </section>

    <section id="tabMove" class="hide">
      <div class="card">
        <h3>Movimento Robot</h3>
        <div class="row">
          <button id="btnStand">Stand</button>
          <button id="btnCrouch" class="warn">Crouch</button>
        </div>
        <div class="row">
          <button id="btnForward">Avanti</button>
          <button id="btnBackward">Indietro</button>
          <button id="btnLeft">Sinistra</button>
          <button id="btnRight">Destra</button>
          <button id="btnTurnLeft">Ruota sx</button>
          <button id="btnTurnRight">Ruota dx</button>
          <button id="btnStop" class="danger">Stop base</button>
        </div>
      </div>
    </section>

    <div class="status" id="status">Pronto.</div>
  </div>

  <script>
    function q(id) { return document.getElementById(id); }
    async function api(path, method, body, timeoutMs) {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), timeoutMs || 90000);
      try {
        const res = await fetch(path, {
          method: method || 'GET',
          headers: body ? { 'Content-Type': 'application/json' } : {},
          body: body ? JSON.stringify(body) : undefined,
          signal: ctrl.signal,
        });
        const text = await res.text();
        const data = text ? JSON.parse(text) : {};
        if (!res.ok && data.ok !== false) data.ok = false;
        data._http = res.status;
        return data;
      } finally { clearTimeout(tid); }
    }
    function setStatus(msg, ok) {
      const el = q('status');
      el.textContent = msg;
      el.className = 'status ' + (ok === true ? 'ok' : (ok === false ? 'bad' : ''));
    }

    function bindSlider(id, out, digits) {
      const a = q(id), b = q(out);
      const draw = () => { b.textContent = Number(a.value).toFixed(digits || 0); };
      a.addEventListener('input', draw);
      draw();
    }

    async function callAndShow(label, path, method, body, timeoutMs) {
      setStatus(label + '...', null);
      try {
        const d = await api(path, method, body, timeoutMs);
        setStatus(label + ': ' + (d.ok ? 'OK' : (d.reason || 'KO')), !!d.ok);
      } catch (e) {
        setStatus(label + ': ' + String(e), false);
      }
    }

    async function saveOffsets() {
      const off = [Number(q('offJ0').value), Number(q('offJ1').value), Number(q('offJ2').value), 0, 0, 0];
      const j5 = Number(q('offJ5').value);
      setStatus('Salvo offset...', null);
      try {
        const a = await api('/api/pick/preset', 'POST', { joint_offset_deg: off });
        const b = await api('/api/pick/preset', 'POST', { manual_orient_offset_deg: j5 });
        setStatus((a.ok && b.ok) ? 'Offset salvati' : 'Errore salvataggio offset', !!(a.ok && b.ok));
      } catch (e) { setStatus(String(e), false); }
    }

    async function sideScanDetect(side) {
      const left = Number(q('scanLeft').value);
      const right = Number(q('scanRight').value);
      const vals = {
        left: [left, 19.2, 26.0, 0.1, 37.8, 0.4, 5.0],
        right: [right, 19.2, 26.0, 0.1, 37.8, 0.4, 5.0],
      };
      const body = { side: side, override_servo_deg: vals[side] };
      setStatus('Scan ' + side + ' + detection...', null);
      try {
        const d = await api('/api/scan/side_detect', 'POST', body, 120000);
        setStatus('Scan ' + side + ': ' + (d.ok ? 'OK detection' : 'KO ' + (d.reason || '')), !!d.ok);
      } catch (e) { setStatus(String(e), false); }
    }

    async function baseMode(mode, enable) {
      await callAndShow('Base ' + mode, '/api/base/accompany_mode', 'POST', {
        mode: mode,
        enable: enable !== false,
        sync: true,
      }, 70000);
    }

    q('tabTeachBtn').onclick = function () {
      q('tabTeach').classList.remove('hide');
      q('tabMove').classList.add('hide');
      q('tabTeachBtn').classList.add('active');
      q('tabMoveBtn').classList.remove('active');
    };
    q('tabMoveBtn').onclick = function () {
      q('tabMove').classList.remove('hide');
      q('tabTeach').classList.add('hide');
      q('tabMoveBtn').classList.add('active');
      q('tabTeachBtn').classList.remove('active');
    };

    bindSlider('scanRight', 'scanRightVal', 0);
    bindSlider('scanLeft', 'scanLeftVal', 0);
    bindSlider('offJ0', 'offJ0Val', 1);
    bindSlider('offJ1', 'offJ1Val', 1);
    bindSlider('offJ2', 'offJ2Val', 1);
    bindSlider('offJ5', 'offJ5Val', 0);

    q('btnCouple').onclick = () => callAndShow('Coppia ON', '/api/arm/couple', 'POST', {});
    q('btnEnable').onclick = () => callAndShow('Enable motori', '/api/joints/enable', 'POST', { with_power: true, mode: 1 });
    q('btnPower').onclick = () => callAndShow('Power ON', '/api/joints/power', 'POST', {});
    q('btnHold').onclick = () => callAndShow('Hold', '/api/joints/hold', 'POST', {});
    q('btnRelease').onclick = () => callAndShow('Release', '/api/joints/release', 'POST', {});
    q('btnZero').onclick = () => callAndShow('Zero', '/api/joints/zero', 'POST', {});

    q('btnRightScan').onclick = () => sideScanDetect('right');
    q('btnLeftScan').onclick = () => sideScanDetect('left');
    q('btnDetectNow').onclick = () => callAndShow('Detection', '/api/pick/detect', 'POST', { capture_if_missing: true }, 120000);
    q('btnTestGrasp').onclick = () => callAndShow('Prova presa', '/api/pick/grasp/goto', 'POST', {}, 120000);
    q('btnApplyOffsets').onclick = saveOffsets;

    q('btnStand').onclick = () => baseMode('stand_up', true);
    q('btnCrouch').onclick = () => baseMode('crouch', true);
    q('btnForward').onclick = () => baseMode('forward', true);
    q('btnBackward').onclick = () => baseMode('backward', true);
    q('btnLeft').onclick = () => baseMode('left', true);
    q('btnRight').onclick = () => baseMode('right', true);
    q('btnTurnLeft').onclick = () => baseMode('turn_left', true);
    q('btnTurnRight').onclick = () => baseMode('turn_right', true);
    q('btnStop').onclick = () => baseMode('stop', false);
  </script>
</body>
</html>
