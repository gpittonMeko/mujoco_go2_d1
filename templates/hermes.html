<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes</title>
  <link rel="stylesheet" href="/static/hermes.css" />
</head>
<body>
  <div class="hermes-app">
    <header class="hermes-top">
      <h1>Hermes</h1>
      <span class="hermes-port">:{{ port }}</span>
      <span id="hermesStatus" class="hermes-status">…</span>
    </header>
    <div id="chatLog" class="hermes-log">
      <p class="hermes-msg hermes-msg-bot">Ciao, sono Hermes. Chiedi camere, braccio o presa — rispondo dai dati live e parlo dalle casse del Go2.</p>
    </div>
    <form id="chatForm" class="hermes-form">
      <input id="chatInput" type="text" placeholder="Messaggio…" autocomplete="off" />
      <button type="submit">Invia</button>
    </form>
  </div>
  <script src="/static/hermes.js" defer></script>
</body>
</html>
