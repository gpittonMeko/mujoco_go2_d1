<div class="modal-overlay" id="tcpJogModal" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-labelledby="tcpModalTitle">
    <div class="modal-head">
      <h2 id="tcpModalTitle">Jog TCP</h2>
      <button type="button" class="modal-close" id="tcpModalClose" title="Chiudi">×</button>
    </div>
    <div class="modal-body">
      <div class="tcp-box" id="tcpReadout">TCP — mm</div>
      <div class="speed-panel">
        <label>Velocità jog</label>
        <div class="speed-row">
          <input type="range" id="speedPct" min="1" max="100" value="25" />
          <span class="speed-val" id="speedPctLabel">25%</span>
        </div>
        <div class="motion-grid">
          <label>Accelerazione (mm/s²)
            <input type="number" id="accelMm" min="20" max="800" step="10" value="120" />
          </label>
          <label>Decelerazione (mm/s²)
            <input type="number" id="decelMm" min="20" max="800" step="10" value="150" />
          </label>
        </div>
      </div>
      <div class="pad-wrap">
        <div class="cart-grid" id="cartGrid">
          <div class="spacer"></div>
          <button type="button" class="arrow z" data-axis="z" data-sign="1">Z+</button>
          <div class="spacer"></div>
          <button type="button" class="arrow" data-axis="y" data-sign="-1">Y−</button>
          <button type="button" class="arrow" data-axis="x" data-sign="1">X+</button>
          <button type="button" class="arrow" data-axis="y" data-sign="1">Y+</button>
          <div class="spacer"></div>
          <button type="button" class="arrow" data-axis="x" data-sign="-1">X−</button>
          <div class="spacer"></div>
          <div class="spacer"></div>
          <button type="button" class="arrow z" data-axis="z" data-sign="-1">Z−</button>
          <div class="spacer"></div>
        </div>
      </div>
      <p id="cartStatus">Tieni premuta una freccia</p>
      <p class="hint">Movimento continuo in TCP — chiudi il popup quando hai finito.</p>
    </div>
  </div>
</div>
